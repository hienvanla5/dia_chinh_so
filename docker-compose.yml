services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: diachinhso_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: diachinhso_user
      POSTGRES_PASSWORD: diachinhso_password_2026
      POSTGRES_DB: diachinhso_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diachinhso_user -d diachinhso_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: diachinhso_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: diachinhso_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: diachinhso_admin
      MINIO_ROOT_PASSWORD: diachinhso_admin_password_2026
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  redis_data:
  minio_data:
